[package]
name = "gpui-cef"
description = "Embed a real browser engine (Chromium/CEF on macOS, WebView2 on Windows) into gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# ResourceType: the request filter hook's input.
baa-privacy.workspace = true
gpui.workspace = true
log.workspace = true
parking_lot.workspace = true
# gpui's NSView / HWND, to parent the native page view.
raw-window-handle = "0.6"

[dev-dependencies]
# The usage example in the crate docs starts the app the way an app does.
gpui_platform.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cef.workspace = true
# The punch-hole marker surface (native.rs).
core-video = "0.5.2"
objc2 = "0.6"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
wry = "0.56"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
