[package]
name = "baa-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
gpui.workspace = true
baa-model.workspace = true
baa-privacy.workspace = true
log.workspace = true
serde_json.workspace = true


[target.'cfg(target_os = "macos")'.dependencies]
# gpui's NSView, the punch-hole surface, objc calls.
raw-window-handle = "0.6"
core-video = "0.5.2"
core-foundation = "0.10"
objc2 = "0.6"
# dlopen/dlsym for BaaCore.
libc = "0.2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
