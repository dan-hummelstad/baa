[package]
name = "baa-privacy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Not the workspace pin: its default `single-thread` feature makes `Engine` !Sync, and CEF
# calls `should_block` on its IO thread while the UI thread toggles and rebuilds.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
# Both already in the graph via adblock / gpui; used to unpack bundled lists and $redirect bodies.
base64 = "0.22"
flate2 = "1"
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
