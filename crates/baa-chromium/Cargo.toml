[package]
name = "baa-chromium"
description = "Phase 2 spike: gpui shell on baa's own Chromium (BaaCore.framework). See PLAN-chromium-phase2.md."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "spike"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
gpui.workspace = true
gpui_platform.workspace = true
# Same versions as vendor/gpui-cef: gpui's NSView, the punch-hole surface, objc calls.
raw-window-handle = "0.6"
core-video = "0.5.2"
core-foundation = "0.10"
objc2 = "0.6"
# dlopen/dlsym for BaaCore.
libc = "0.2"
