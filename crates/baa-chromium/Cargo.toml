[package]
name = "baa-chromium"
description = "Test harness for //baa: a gpui shell that drives BaaCore.framework (ci.sh runs tests/*.expect against it)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "spike"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
gpui.workspace = true
gpui_platform.workspace = true
# gpui's NSView, the punch-hole surface, objc calls (the versions baa-web uses).
raw-window-handle = "0.6"
core-video = "0.5.2"
core-foundation = "0.10"
objc2 = "0.6"
# dlopen/dlsym for BaaCore.
libc = "0.2"
