[package]
name = "baa"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "baa"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
baa-ui.workspace = true
baa-web.workspace = true
baa-model.workspace = true
log.workspace = true
env_logger.workspace = true
# Already in the graph via gpui: an unbounded channel from the open-URL thread and
# gpui's on_open_urls (neither has an App) into the foreground.
futures = "0.3"
# Already in the graph via gpui: getpeereid on agent.sock connections.
libc = "0.2"
