[package]
name = "baa-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
gpui.workspace = true
baa-model.workspace = true
baa-mail.workspace = true
baa-web.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
# Already in the graph via gpui (and the app shell): channels from the agent socket's and the
# chat child's reader threads into the foreground.
futures = "0.3"
# Already in the graph via gpui: its RenderImage frames, for history swipe pictures.
image = { version = "0.25", default-features = false }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# Already in the graph via baa-model: a test writes a value baa.db cannot read back.
rusqlite.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the graph via baa-web: the traffic lights' hover areas after a move (browser.rs).
raw-window-handle = "0.6"
objc2 = "0.6"
