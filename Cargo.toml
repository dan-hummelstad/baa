[workspace]
resolver = "2"
members = [
  "crates/baa",
  "crates/baa-ui",
  "crates/baa-web",
  "crates/baa-model",
  "crates/baa-privacy",
  "crates/baa-chromium",
  "xtask",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/dan-hummelstad/baa"

[workspace.dependencies]
# gpui is taken from Zed's repo (crates.io lags a year). One rev for the whole
# workspace; bump it in one place.
gpui = { git = "https://github.com/zed-industries/zed", rev = "ef075910c99ce2c8fd07da4174e7c3bb71513f35" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ef075910c99ce2c8fd07da4174e7c3bb71513f35", features = ["font-kit", "runtime_shaders"] }
baa-ui = { path = "crates/baa-ui" }
baa-web = { path = "crates/baa-web" }
baa-model = { path = "crates/baa-model" }
baa-privacy = { path = "crates/baa-privacy" }
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 4

# Punch-hole surfaces so native page views show through gpui's layer; see vendor/gpui_apple/Cargo.toml.
[patch."https://github.com/zed-industries/zed"]
gpui_apple = { path = "vendor/gpui_apple" }
