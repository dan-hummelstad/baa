# PLAN.md §5.3: bundle a release engine with the Rust app and launch it behind
# mitmproxy for 60 s; any host outside baa_privacy::PROXY_ALLOWLIST fails the job.
# Needs a checkout and the setup action first, on macOS.
name: privacy
description: Run the proxy privacy test on a baa-engine artifact
inputs:
  run-id:
    description: workflow run that holds the engine artifact
    required: true
  artifact:
    description: engine artifact name (baa-engine-<tree>)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}
        path: target/engine
    # The producer's checksum from the same run. run-id is the engine action's trusted run or chromium.yml's own.
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}.sha256
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}
        path: target/engine
    - shell: bash
      run: |
        (cd target/engine && shasum -a 256 -c engine.tar.zst.sha256)
        zstd -dc target/engine/engine.tar.zst | tar -xf - -C target/engine
        # A runner has no signing identity: "-" signs ad hoc.
        BAA_SIGN_IDENTITY=- cargo bundle --release --engine target/engine
        cargo run --release -p baa-privacy --example proxy_allowlist > proxy-allowlist.txt
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
    - shell: bash
      run: |
        pip install --require-hashes --only-binary :all: -r xtask/privacy-requirements.txt
        python3 xtask/privacy_test.py target/bundle/baa.app proxy-allowlist.txt --seconds 60 --netlog netlog.json
    - if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: privacy-netlog
        path: netlog.json
