# Build environment shared by ci.yml and release.yml: Rust (rust-toolchain.toml) and sccache.
name: setup
description: Rust build environment for baa
runs:
  using: composite
  steps:
    - uses: mozilla-actions/sccache-action@v0.0.11
    - run: rustup toolchain install
      shell: bash
    - shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
