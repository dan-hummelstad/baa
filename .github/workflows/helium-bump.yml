# Weekly: if imputnet/helium-macos has a newer release than chromium/HELIUM_RELEASE,
# take it onto a bot branch (helium-take.sh) and start the chromium (release) and ci
# runs on it. From there it runs itself: when that release build passes its privacy
# and harness tests and ci is green, chromium.yml's land job puts the branch on main,
# bumps the version and starts release.yml. No PR (trunk-based; Actions may not open one).
# A step that fails (a conflict here, a baa patch that no longer applies there) stops
# for a fix: commit it to the bot branch and run chromium.yml release on it again.
name: helium-bump

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          NEW=$(gh api repos/imputnet/helium-macos/releases/latest -q .tag_name)
          if [ "$NEW" = "$(cat chromium/HELIUM_RELEASE)" ]; then echo "Helium $NEW is already vendored"; exit 0; fi
          B=bot/helium-$NEW
          if git ls-remote --exit-code --heads origin "$B" >/dev/null; then echo "$B exists: its chromium.yml release run lands it, or delete it to bump again"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$B"
          .github/helium-take.sh "$NEW" || {
            git diff --name-only --diff-filter=U
            echo "::error::Helium $NEW conflicts with baa's edits in chromium/helium*: run .github/helium-take.sh $NEW on a branch $B from main, resolve, push it, then run chromium.yml release on it"
            exit 1
          }
          git push origin "$B"
          # A push by GITHUB_TOKEN starts no workflows, so start both here.
          gh workflow run chromium.yml --ref "$B" -f mode=release
          gh workflow run ci.yml --ref "$B"
