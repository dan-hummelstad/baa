# Weekly: if imputnet/helium-macos has a newer release than chromium/HELIUM_RELEASE,
# subtree-pull Helium and helium-macos onto a bot branch and start the chromium (release)
# and ci runs on it. No PR (trunk-based, and Actions may not open one): when both are green,
# someone rebases the branch onto main, pushes it fast-forward and deletes it.
name: helium-bump

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          NEW=$(gh api repos/imputnet/helium-macos/releases/latest -q .tag_name)
          if [ "$NEW" = "$(cat chromium/HELIUM_RELEASE)" ]; then echo "Helium $NEW is already vendored"; exit 0; fi
          B=bot/helium-$NEW
          if git ls-remote --exit-code --heads origin "$B" >/dev/null; then echo "$B exists: land it on main when its runs are green, or delete it to bump again"; exit 0; fi
          HELIUM=$(gh api "repos/imputnet/helium-macos/contents/helium-chromium?ref=$NEW" -q .sha)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$B"
          fail() { echo "::error::$1. Take the release by hand: see 'Taking a Helium release' in PLAN-chromium.md (branch $B is not pushed)"; exit 1; }
          git subtree pull --prefix chromium/helium https://github.com/imputnet/helium.git "$HELIUM" --squash -m "chromium: vendor imputnet/helium $HELIUM (for $NEW)" \
            || fail "helium subtree pull conflicted"
          # helium-macos pins Helium as the helium-chromium submodule, which baa drops (Helium is the
          # chromium/helium subtree). Each release moves that pin: a modify/delete conflict with
          # nothing to decide. Any other conflict stops here.
          SUB='chromium/helium-macos/(helium-chromium|\.gitmodules)'
          if ! git subtree pull --prefix chromium/helium-macos https://github.com/imputnet/helium-macos.git "$NEW" --squash -m "chromium: vendor imputnet/helium-macos $NEW"; then
            ! git diff --name-only --diff-filter=U | grep -qvxE "$SUB" || fail "helium-macos subtree pull conflicted"
            git rm -q --cached --ignore-unmatch chromium/helium-macos/helium-chromium chromium/helium-macos/.gitmodules
            git commit -q --no-edit
          fi
          git rm -q --cached --ignore-unmatch chromium/helium-macos/helium-chromium chromium/helium-macos/.gitmodules
          echo "$NEW" > chromium/HELIUM_RELEASE
          git add chromium/HELIUM_RELEASE
          git commit -q -m "chromium: Helium $NEW"
          git push origin "$B"
          # A push by GITHUB_TOKEN starts no workflows, so start both here.
          gh workflow run chromium.yml --ref "$B" -f mode=release
          gh workflow run ci.yml --ref "$B"
          echo "Helium $NEW is on $B (https://github.com/imputnet/helium-macos/releases/tag/$NEW). When chromium.yml and ci.yml are green there: git rebase origin/main, push to main, delete $B." >> "$GITHUB_STEP_SUMMARY"
