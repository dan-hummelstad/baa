# PLAN.md §13, PLAN-chromium-phase5.md 6.2-6.3. On a v* tag: take the release
# engine built from this commit's chromium/ tree (chromium.yml mode=release),
# add the Rust binary, sign with Chromium's signer, run the privacy test on the
# signed app, notarise a DMG and publish a GitHub Release.
#
# Secrets, by name:
#   MACOS_CERT_P12_BASE64   "Developer ID Application" certificate + private key (.p12), base64
#   MACOS_CERT_PASSWORD     password of that .p12
#   MACOS_SIGN_IDENTITY     e.g. "Developer ID Application: DANIEL JOHN HUMMELSTAD (LJNQV2DKTV)"
#   APPLE_ID                Apple ID used for notarization
#   APPLE_TEAM_ID           10-character Apple team ID
#   APPLE_APP_PASSWORD      app-specific password for APPLE_ID
# Without MACOS_CERT_P12_BASE64 the release is ad-hoc signed and not notarised
# (user decision 2026-11-06: no CI signing for now); adding the secrets switches
# to Developer ID + notarisation with no other change.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          version=${GITHUB_REF_NAME#v}
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="baa").version')
          [ "$version" = "$crate" ] || { echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  engine:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.engine.outputs.run }}
      name: ${{ steps.engine.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: engine
        uses: ./.github/actions/engine
        with:
          required: true

  macos:
    needs: [version, engine]
    runs-on: macos-15
    outputs:
      signed: ${{ env.SIGNED }}
    env:
      # Secrets cannot appear in `if:`; this can.
      SIGNED: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.engine.outputs.name }}
          run-id: ${{ needs.engine.outputs.run }}
          github-token: ${{ github.token }}
          path: engine
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.engine.outputs.name }}.sha256
          run-id: ${{ needs.engine.outputs.run }}
          github-token: ${{ github.token }}
          path: engine
      - name: Unpack engine, add the Rust binary
        run: |
          (cd engine && shasum -a 256 -c engine.tar.zst.sha256)
          zstd -dc engine/engine.tar.zst | tar -xf - -C engine
          cargo bundle --release --engine engine --no-sign
          # The signer's --input holds the app and the Packaging directory. The signer
          # comes from this checkout, never the artifact: this job holds the signing secrets.
          cp -R chromium/packaging "target/bundle/baa Packaging"
          cargo run --release -p baa-privacy --example proxy_allowlist > proxy-allowlist.txt
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Pinned by version and hash: mitmproxy runs in the privacy test after the
      # Developer ID certificate is in the keychain.
      - run: |
          pip install --require-hashes --only-binary :all: -r xtask/privacy-requirements.txt
      - name: Rust crate notices
        run: |
          cargo install cargo-about --version 0.9.3 --locked --features cli
          cargo about generate about.hbs > target/bundle/baa.app/Contents/Resources/rust-credits.html
      - if: env.SIGNED == 'true'
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}
      - name: Sign, test, package, notarize
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -eux
          if [ "$SIGNED" = true ]; then
            python3 "target/bundle/baa Packaging/sign_chrome.py" --input target/bundle \
              --output target/bundle/signed --identity "$MACOS_SIGN_IDENTITY" --disable-packaging \
              --notarize staple --notary-arg=--apple-id="$APPLE_ID" --notary-arg=--team-id="$APPLE_TEAM_ID" \
              --notary-arg=--password="$APPLE_APP_PASSWORD"
            # The signer adds the secure timestamp only with --notarize; it staples the app.
            # Path per Helium's sign_and_package_app.sh (out/Default/signed/stable/); check on the first run.
            APP=$(find target/bundle/signed -name baa.app -maxdepth 3 | head -1)
            # The signer's own Gatekeeper check is off (it ran before notarization); this is it, on what ships.
            spctl --assess -vv "$APP"
            SUFFIX=
          else
            # ponytail: ad-hoc signature, no hardened runtime, not notarised; users open it
            # with right-click → Open. Developer ID once the secrets exist.
            APP=target/bundle/baa.app
            codesign --force --deep --sign - --identifier me.baa.browser "$APP"
            SUFFIX=-unsigned
          fi
          codesign -dv "$APP" 2>&1 | grep -E 'flags=|TeamIdentifier=|Signature='
          # The signed app, as shipped.
          env -u APPLE_APP_PASSWORD -u APPLE_ID python3 xtask/privacy_test.py "$APP" proxy-allowlist.txt --seconds 60 --netlog netlog.json
          mkdir "$RUNNER_TEMP/dmg"
          ditto "$APP" "$RUNNER_TEMP/dmg/baa.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          cp assets/baa.icns "$RUNNER_TEMP/dmg/.VolumeIcon.icns"
          DMG="baa-$VER-macos-arm64$SUFFIX.dmg"
          # The volume shows .VolumeIcon.icns only with the custom-icon Finder flag set on its
          # root, which needs a writable image: build read-write, flag it, then compress.
          hdiutil create -volname baa -srcfolder "$RUNNER_TEMP/dmg" -fs HFS+ -format UDRW "$RUNNER_TEMP/rw.dmg"
          MNT=$(hdiutil attach "$RUNNER_TEMP/rw.dmg" -nobrowse -noautoopen | awk -F'\t' '/\/Volumes\//{print $NF}')
          xattr -wx com.apple.FinderInfo 0000000000000000040000000000000000000000000000000000000000000000 "$MNT"
          # Spotlight/fseventsd on hosted runners can hold the volume briefly.
          hdiutil detach "$MNT" || { sleep 5; hdiutil detach -force "$MNT"; }
          hdiutil convert "$RUNNER_TEMP/rw.dmg" -format ULMO -o "$DMG"
          if [ "$SIGNED" = true ]; then
            cargo run --release -p xtask -- sign "$DMG"
            cargo run --release -p xtask -- notarize "$DMG"
          fi
      # Sparkle's feed: Info.plist's SUFeedURL (xtask) is releases/latest/download/appcast.xml, so
      # each release's appcast names its own DMG. sign_update is pinned by hash and gets the key on
      # stdin; the app accepts only DMGs signed with it (SUPublicEDKey).
      - name: Sparkle appcast
        if: env.SIGNED == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || { echo "::error::no SPARKLE_ED_PRIVATE_KEY secret: this release would have no update feed"; exit 1; }
          S="$RUNNER_TEMP/sparkle"
          mkdir "$S"
          curl -fsSL --proto =https --proto-redir =https -o "$S/sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $S/sparkle.tar.xz" | shasum -a 256 -c
          tar -xJf "$S/sparkle.tar.xz" -C "$S"
          DMG="baa-$VER-macos-arm64.dmg"
          ATTRS=$(printenv SPARKLE_ED_PRIVATE_KEY | "$S/bin/sign_update" --ed-key-file - "$DMG")
          case $ATTRS in
            'sparkle:edSignature="'*'" length="'*'"') ;;
            *) echo "::error::unexpected sign_update output"; exit 1 ;;
          esac
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$DMG"
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            echo '<channel><title>baa</title><item>'
            echo "<title>baa $VER</title><pubDate>$(date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>"
            echo "<sparkle:version>$VER</sparkle:version><sparkle:shortVersionString>$VER</sparkle:shortVersionString>"
            echo "<enclosure url=\"$URL\" type=\"application/octet-stream\" $ATTRS/>"
            echo '</item></channel></rss>'
          } > appcast.xml
          cat appcast.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            baa-*.dmg
            appcast.xml
            engine/engine.json
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: privacy-netlog
          path: netlog.json
          if-no-files-found: ignore

  publish:
    needs: [version, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.macos.outputs.signed }}
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          e=dist/engine/engine.json
          notes="Engine: Chromium $(jq -r .chromium "$e"), Helium $(jq -r .helium "$e"), engine $(jq -r '.tree[0:8]' "$e"). Source: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME"
          if [ "$SIGNED" != true ]; then
            notes="$notes"$'\n\n'"Not signed with a Developer ID or notarised yet: open it with right-click → Open (or \`xattr -dr com.apple.quarantine /Applications/baa.app\`)."
          fi
          # ponytail: GitHub Release only; mirroring to baa.me/dl (§13) waits until baa.me hosts anything.
          # An unsigned release has no appcast: Sparkle would reject its ad-hoc signature anyway.
          files=(dist/baa-*.dmg dist/engine/engine.json)
          [ ! -f dist/appcast.xml ] || files+=(dist/appcast.xml)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "baa $VER" --notes "$notes" --generate-notes
