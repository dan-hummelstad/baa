# PLAN.md §13, PLAN-chromium-phase5.md 6.2-6.3. On a v* tag: take the release
# engine built from this commit's chromium/ tree (chromium.yml mode=release),
# add the Rust binary, sign with Chromium's signer, run the privacy test on the
# signed app, notarise a DMG and publish a GitHub Release.
#
# Secrets, by name:
#   MACOS_CERT_P12_BASE64   "Developer ID Application" certificate + private key (.p12), base64
#   MACOS_CERT_PASSWORD     password of that .p12
#   MACOS_SIGN_IDENTITY     e.g. "Developer ID Application: DANIEL JOHN HUMMELSTAD (LJNQV2DKTV)"
#   APPLE_ID                Apple ID used for notarization
#   APPLE_TEAM_ID           10-character Apple team ID
#   APPLE_APP_PASSWORD      app-specific password for APPLE_ID
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=${GITHUB_REF_NAME#v}
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="baa").version')
          [ "$version" = "$crate" ] || { echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  engine:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.engine.outputs.run }}
      name: ${{ steps.engine.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - id: engine
        uses: ./.github/actions/engine
      - if: steps.engine.outputs.run == ''
        run: |
          echo "::error::no engine for chromium/ tree ${{ steps.engine.outputs.tree }}; run: gh workflow run chromium.yml -f mode=release --ref $GITHUB_REF_NAME, then re-run this workflow"
          exit 1

  macos:
    needs: [version, engine]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.engine.outputs.name }}
          run-id: ${{ needs.engine.outputs.run }}
          github-token: ${{ github.token }}
          path: engine
      - name: Unpack engine, add the Rust binary
        run: |
          zstd -dc engine/engine.tar.zst | tar -xf - -C engine
          cargo bundle --release --engine engine --no-sign
          # The signer's --input holds the app and the Packaging directory.
          cp -R "engine/baa Packaging" target/bundle/
          cargo run --release -p baa-privacy --example proxy_allowlist > proxy-allowlist.txt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install mitmproxy
      - name: Rust crate notices
        run: |
          cargo install cargo-about --locked --features cli
          cargo about generate about.hbs > target/bundle/baa.app/Contents/Resources/rust-credits.html
      - uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}
      - name: Sign, test, package, notarize
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -eux
          python3 "target/bundle/baa Packaging/sign_chrome.py" --input target/bundle \
            --output target/bundle/signed --identity "$MACOS_SIGN_IDENTITY" --disable-packaging \
            --notarize staple --notary-arg=--apple-id="$APPLE_ID" --notary-arg=--team-id="$APPLE_TEAM_ID" \
            --notary-arg=--password="$APPLE_APP_PASSWORD"
          # The signer adds the secure timestamp only with --notarize; it staples the app.
          # Path per Helium's sign_and_package_app.sh (out/Default/signed/stable/); check on the first run.
          APP=$(find target/bundle/signed -name baa.app -maxdepth 3 | head -1)
          codesign -dv "$APP" 2>&1 | grep -E 'flags=|TeamIdentifier='
          # The signed app, as shipped.
          python3 xtask/privacy_test.py "$APP" proxy-allowlist.txt --seconds 60 --netlog netlog.json
          mkdir "$RUNNER_TEMP/dmg"
          ditto "$APP" "$RUNNER_TEMP/dmg/baa.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          DMG="baa-$VER-macos-arm64.dmg"
          hdiutil create -volname baa -srcfolder "$RUNNER_TEMP/dmg" -format ULMO "$DMG"
          cargo run --release -p xtask -- sign "$DMG"
          cargo run --release -p xtask -- notarize "$DMG"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            baa-*.dmg
            engine/engine.json
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: privacy-netlog
          path: netlog.json
          if-no-files-found: ignore

  publish:
    needs: [version, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          e=dist/engine/engine.json
          notes="Engine: Chromium $(jq -r .chromium "$e"), Helium $(jq -r .helium "$e"), engine $(jq -r '.tree[0:8]' "$e"). Source: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME"
          # ponytail: GitHub Release only; mirroring to baa.me/dl (§13) waits until baa.me hosts anything.
          gh release create "$GITHUB_REF_NAME" dist/baa-*.dmg dist/engine/engine.json --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "baa ${{ needs.version.outputs.version }}" --notes "$notes" --generate-notes
