# baa's Chromium: the vendored, baa-branded Helium patch set (chromium/helium,
# chromium/helium-macos), prepared by Helium's own scripts and built the way
# Helium's building.yml does: one run of chained phases (chromium-phase.yml),
# each compiling for up to ~4.75 h of its 6 h job limit; a phase only runs if
# the one before it is still compiling, so the rest show as skipped.
# One run stays on its commit, and phases share the chromium-tree-xcode<version> artifact.
# mode=dev is a component build whose finished tree is kept for 7 days, to
# unpack locally and build incrementally from; it runs on the runner and Xcode
# matching the local Mac, or the SDK headers' mtimes force a full rebuild.
name: chromium
run-name: chromium ${{ inputs.mode }}${{ inputs.budget_minutes && format(' (test, {0} min)', inputs.budget_minutes) || '' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dev (component build, tree kept) or release (official)"
        default: dev
      runner:
        default: xcode-27
      xcode:
        description: "match the dev Mac (xcodebuild -version), or its downloaded tree rebuilds"
        default: "27.2"
      budget_minutes:
        description: "test the phase hand-off: compile only this long per phase"
        default: ""
      base_run:
        description: "dev: build on this finished run's tree; empty picks the newest, none builds from scratch"
        default: ""

# actions: read lets phase 1 find and download an earlier run's tree.
permissions:
  contents: read
  actions: read

# One chain per mode at a time (two builds on one tree would clash); a waiting
# run is replaced by a newer one, never a running one cancelled.
concurrency:
  group: chromium-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  phase_01:
    uses: ./.github/workflows/chromium-phase.yml
    with:
      phase: 1
      base_run: ${{ inputs.base_run }}
      mode: ${{ inputs.mode }}
      runner: ${{ inputs.runner }}
      xcode: ${{ inputs.xcode }}
      budget_minutes: ${{ inputs.budget_minutes }}

  phase_02:
    needs: phase_01
    if: needs.phase_01.outputs.status == 'running'
    uses: ./.github/workflows/chromium-phase.yml
    with:
      phase: 2
      mode: ${{ inputs.mode }}
      runner: ${{ inputs.runner }}
      xcode: ${{ inputs.xcode }}
      budget_minutes: ${{ inputs.budget_minutes }}

  phase_03:
    needs: phase_02
    if: needs.phase_02.outputs.status == 'running'
    uses: ./.github/workflows/chromium-phase.yml
    with:
      phase: 3
      mode: ${{ inputs.mode }}
      runner: ${{ inputs.runner }}
      xcode: ${{ inputs.xcode }}
      budget_minutes: ${{ inputs.budget_minutes }}

  phase_04:
    needs: phase_03
    if: needs.phase_03.outputs.status == 'running'
    uses: ./.github/workflows/chromium-phase.yml
    with:
      phase: 4
      mode: ${{ inputs.mode }}
      runner: ${{ inputs.runner }}
      xcode: ${{ inputs.xcode }}
      budget_minutes: ${{ inputs.budget_minutes }}

  phase_05:
    needs: phase_04
    if: needs.phase_04.outputs.status == 'running'
    uses: ./.github/workflows/chromium-phase.yml
    with:
      phase: 5
      mode: ${{ inputs.mode }}
      runner: ${{ inputs.runner }}
      xcode: ${{ inputs.xcode }}
      budget_minutes: ${{ inputs.budget_minutes }}

  phase_06:
    needs: phase_05
    if: needs.phase_05.outputs.status == 'running'
    uses: ./.github/workflows/chromium-phase.yml
    with:
      phase: 6
      mode: ${{ inputs.mode }}
      runner: ${{ inputs.runner }}
      xcode: ${{ inputs.xcode }}
      budget_minutes: ${{ inputs.budget_minutes }}

  phase_07:
    needs: phase_06
    if: needs.phase_06.outputs.status == 'running'
    uses: ./.github/workflows/chromium-phase.yml
    with:
      phase: 7
      mode: ${{ inputs.mode }}
      runner: ${{ inputs.runner }}
      xcode: ${{ inputs.xcode }}
      budget_minutes: ${{ inputs.budget_minutes }}

  phase_08:
    needs: phase_07
    if: needs.phase_07.outputs.status == 'running'
    uses: ./.github/workflows/chromium-phase.yml
    with:
      phase: 8
      mode: ${{ inputs.mode }}
      runner: ${{ inputs.runner }}
      xcode: ${{ inputs.xcode }}
      budget_minutes: ${{ inputs.budget_minutes }}

  phase_09:
    needs: phase_08
    if: needs.phase_08.outputs.status == 'running'
    uses: ./.github/workflows/chromium-phase.yml
    with:
      phase: 9
      mode: ${{ inputs.mode }}
      runner: ${{ inputs.runner }}
      xcode: ${{ inputs.xcode }}
      budget_minutes: ${{ inputs.budget_minutes }}

  phase_10:
    needs: phase_09
    if: needs.phase_09.outputs.status == 'running'
    uses: ./.github/workflows/chromium-phase.yml
    with:
      phase: 10
      mode: ${{ inputs.mode }}
      runner: ${{ inputs.runner }}
      xcode: ${{ inputs.xcode }}
      budget_minutes: ${{ inputs.budget_minutes }}

  phase_11:
    needs: phase_10
    if: needs.phase_10.outputs.status == 'running'
    uses: ./.github/workflows/chromium-phase.yml
    with:
      phase: 11
      mode: ${{ inputs.mode }}
      runner: ${{ inputs.runner }}
      xcode: ${{ inputs.xcode }}
      budget_minutes: ${{ inputs.budget_minutes }}

  phase_12:
    needs: phase_11
    if: needs.phase_11.outputs.status == 'running'
    uses: ./.github/workflows/chromium-phase.yml
    with:
      phase: 12
      last: true
      mode: ${{ inputs.mode }}
      runner: ${{ inputs.runner }}
      xcode: ${{ inputs.xcode }}
      budget_minutes: ${{ inputs.budget_minutes }}

  # §5.3 on the engine this run built: a release engine that contacts a host
  # outside baa_privacy::PROXY_ALLOWLIST fails the run.
  privacy:
    needs: [phase_01, phase_02, phase_03, phase_04, phase_05, phase_06, phase_07, phase_08, phase_09, phase_10, phase_11, phase_12]
    if: always() && inputs.mode != 'dev' && contains(needs.*.outputs.status, 'finished')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: engine
        run: echo "name=baa-engine-$(git rev-parse HEAD:chromium)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/privacy
        with:
          run-id: ${{ github.run_id }}
          artifact: ${{ steps.engine.outputs.name }}

  # The //baa harness tests (crates/baa-chromium/tests) on the same engine.
  harness:
    needs: [phase_01, phase_02, phase_03, phase_04, phase_05, phase_06, phase_07, phase_08, phase_09, phase_10, phase_11, phase_12]
    if: always() && inputs.mode != 'dev' && contains(needs.*.outputs.status, 'finished')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: engine
        run: echo "name=baa-engine-$(git rev-parse HEAD:chromium)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/harness
        with:
          run-id: ${{ github.run_id }}
          artifact: ${{ steps.engine.outputs.name }}
