# The checks: every push to main, every pull request, and release.yml before it signs anything.
# Three jobs side by side, none of which depends on timing or on a window:
#   lint     the scripts' own tests, the security greps, and the workflow files themselves
#   test     clippy and the unit tests
#   privacy  PLAN.md §5.3 on the release engine of this commit's chromium/ tree, when one exists
# The engine itself builds in chromium.yml, and the //baa harness tests run in harness.yml,
# which nothing waits for.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Fork PRs run this file: nothing by default, each job asks for what it uses.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s xtask -p 'test_*.py'
      - run: .github/actions/engine/trusted_test.sh
      - run: .github/chromium-next_test.sh
      - run: .github/pack-tree_test.sh
      - run: .github/tree-name_test.sh
      - run: .github/security-lint.sh
      # A mistake in a workflow file otherwise shows when the workflow runs, which for
      # chromium.yml is hours into a build. Exact versions: a new release cannot fail a push unseen.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: pipx run zizmor==1.32.0 --offline --min-severity medium .github

  test:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  privacy:
    runs-on: macos-15
    timeout-minutes: 30
    # actions: read for the engine action and the engine download.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: engine
        uses: ./.github/actions/engine
      - if: steps.engine.outputs.run == ''
        run: echo "::notice::no release engine for chromium/ tree ${{ steps.engine.outputs.tree }} yet; the privacy test runs in that chromium.yml run"
      - if: steps.engine.outputs.run != ''
        uses: ./.github/actions/setup
      - if: steps.engine.outputs.run != ''
        uses: ./.github/actions/privacy
        with:
          run-id: ${{ steps.engine.outputs.run }}
          artifact: ${{ steps.engine.outputs.name }}
