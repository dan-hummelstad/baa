# PLAN.md §13. Test and lint on macOS, then prove the de-Googling holds (§5.3)
# when a release engine for this commit's chromium/ tree exists. The Chromium
# engine itself builds in chromium.yml; no tree is needed here, because baa-web
# loads BaaCore with dlopen at run time.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s xtask -p 'test_*.py'

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo test --release --workspace
      # baa-chromium (the C++ test harness) is not clippy-clean yet.
      - run: cargo clippy --release --workspace --exclude baa-chromium --all-targets -- -D warnings
      - id: engine
        uses: ./.github/actions/engine
      - if: steps.engine.outputs.run != ''
        uses: ./.github/actions/privacy
        with:
          run-id: ${{ steps.engine.outputs.run }}
          artifact: ${{ steps.engine.outputs.name }}
      - if: steps.engine.outputs.run == ''
        run: echo "::notice::no release engine for chromium/ tree ${{ steps.engine.outputs.tree }} yet; the privacy test runs in that chromium.yml run"
