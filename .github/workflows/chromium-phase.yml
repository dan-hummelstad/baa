# One phase of chromium.yml: compile for up to ~4.75 h, then hand the tree to
# the next phase through the run's chromium-tree-xcode<version> artifact.
name: chromium-phase

on:
  workflow_call:
    inputs:
      phase:
        type: number
        required: true
      last:
        type: boolean
        default: false
      mode:
        type: string
        required: true
      runner:
        type: string
        required: true
      xcode:
        type: string
        required: true
      budget_minutes:
        type: string
        default: ""
      base_run:
        type: string
        default: ""
    outputs:
      status:
        value: ${{ jobs.phase.outputs.status }}

# Siso keys its records by absolute path, so a tree only builds incrementally at
# the path it was built at. /Users/Shared exists and is writable on every Mac,
# so a downloaded dev tree unpacks to the same /Users/Shared/hb locally.
# The artifact name carries the Xcode version: other SDK headers mean a rebuild.
# Bump TREE if ROOT ever moves, so no base from the old path is picked.
env:
  ROOT: /Users/Shared/hb
  TREE: chromium-tree-xcode${{ inputs.xcode }}
  # Inputs reach scripts as variables, never spliced into the script text.
  BAA_MODE: ${{ inputs.mode }}
  BAA_XCODE: ${{ inputs.xcode }}
  BAA_BASE_RUN: ${{ inputs.base_run }}
  BAA_BUDGET: ${{ inputs.budget_minutes }}
  BAA_RUNNER: ${{ inputs.runner }}

jobs:
  phase:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    outputs:
      status: ${{ steps.build.outputs.status }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          path: baa

      - name: Prepare runner
        run: |
          set -eux
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          sudo mdutil -a -i off || true
          df -h /
          # Disk is the limit by the last phases (tree + build output + archive): drop what Chromium doesn't use.
          sudo rm -rf "${ANDROID_HOME:-/nonexistent}" /Users/runner/hostedtoolcache /usr/local/share/dotnet \
            ~/Library/Android ~/.dotnet ~/.ghcup ~/.rustup ~/.cargo /usr/local/lib/node_modules \
            /opt/homebrew/Caskroom "$(brew --cache)" || true
          xcrun simctl delete all || true
          sudo rm -rf ~/Library/Developer/CoreSimulator
          # Images list each Xcode under symlinked aliases too; keep the real one.
          XCODE=$(realpath "/Applications/Xcode_$BAA_XCODE.app")
          sudo xcode-select -s "$XCODE"
          for x in /Applications/Xcode_*.app; do [ -L "$x" ] || [ "$x" = "$XCODE" ] || sudo rm -rf "$x"; done
          xcodebuild -downloadComponent MetalToolchain || true
          brew install coreutils zstd gnu-tar rsync
          pip3 install requests pillow --break-system-packages
          df -h /

      # A dev chain builds on the newest finished dev tree of the same Chromium
      # version, so it only recompiles what changed since. base_run: "" picks one,
      # a run id names one, "none" builds from scratch. A release builds from scratch
      # unless base_run names an earlier release run, e.g. one that failed mid-chain.
      - name: Pick base tree (phase 1)
        id: base
        if: inputs.phase == 1 && inputs.base_run != 'none' && (inputs.mode == 'dev' || inputs.base_run != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          R=$GITHUB_REPOSITORY
          want=$(cat baa/chromium/helium/chromium_version.txt)
          # Only a manual dispatch of chromium.yml in this repo (trusted.sh): any PR run can
          # name itself "chromium dev" and upload a tree whose out/ the next build would run.
          # Its tree must carry the checksum Pack tree records; older trees do not.
          # A release base may be a failed chain: its last phase's tree is what is left to finish.
          usable() {
            local run sha arts
            run=$(gh api "repos/$R/actions/runs/$1") || return 1
            baa/.github/actions/engine/trusted.sh "$R" <<<"$run" || return 1
            sha=$(jq -r 'select(.display_title == "chromium " + env.BAA_MODE and (.conclusion == "success" or env.BAA_MODE == "release")) | .head_sha' <<<"$run")
            [ -n "$sha" ] || return 1
            arts=$(gh api "repos/$R/actions/runs/$1/artifacts?per_page=100" -q '[.artifacts[] | select(.expired | not)]')
            jq -e 'any(.name == env.TREE)' <<<"$arts" >/dev/null || return 1
            if ! jq -e 'any(.name == env.TREE + ".sha256")' <<<"$arts" >/dev/null; then
              # Release trees from before the producer checksum (39b112cd) are checked
              # against the sha256 GitHub recorded when the producer uploaded them.
              [ "$BAA_MODE" = release ] || return 1
              ID=$(jq -r 'map(select(.name == env.TREE))[0].id' <<<"$arts")
              DIGEST=$(jq -r 'map(select(.name == env.TREE))[0].digest // empty' <<<"$arts")
              case $DIGEST in sha256:?*) ;; *) return 1 ;; esac
            fi
            [ "$(gh api "repos/$R/contents/chromium/helium/chromium_version.txt?ref=$sha" -q .content | base64 -d)" = "$want" ]
          }
          ID='' DIGEST=''
          B=$BAA_BASE_RUN
          if [ -n "$B" ]; then
            usable "$B" || { echo "::error::run $B has no usable, unexpired Chromium $want $BAA_MODE tree"; exit 1; }
          else
            for r in $(gh api "repos/$R/actions/workflows/chromium.yml/runs?status=success&per_page=50" -q '.workflow_runs[].id'); do
              if usable "$r"; then B=$r; break; fi
            done
          fi
          { echo "run=$B"; echo "id=$ID"; echo "digest=$DIGEST"; } >> "$GITHUB_OUTPUT"
          echo "- base tree: ${B:-none, building from scratch}${DIGEST:+ (checked against the GitHub upload digest)}" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore tree by GitHub's digest
        if: steps.base.outputs.digest != ''
        working-directory: /Users/Shared
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.base.outputs.id }}
          DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          set -eu
          # curl drops the Authorization header on the redirect to blob storage.
          curl -fsSL --proto =https --proto-redir =https -H "Authorization: Bearer $GH_TOKEN" \
            -o tree.zip "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip"
          echo "${DIGEST#sha256:}  tree.zip" | gsha256sum -c
          unzip -q tree.zip tree.tar.zst && rm tree.zip
          gsha256sum tree.tar.zst > tree.tar.zst.sha256

      - name: Restore tree
        if: inputs.phase != 1 || (steps.base.outputs.run != '' && steps.base.outputs.digest == '')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.TREE }}
          run-id: ${{ steps.base.outputs.run || github.run_id }}
          github-token: ${{ github.token }}
          path: /Users/Shared

      - name: Restore tree checksum
        if: inputs.phase != 1 || (steps.base.outputs.run != '' && steps.base.outputs.digest == '')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.TREE }}.sha256
          run-id: ${{ steps.base.outputs.run || github.run_id }}
          github-token: ${{ github.token }}
          path: /Users/Shared

      - name: Unpack tree
        if: inputs.phase != 1 || steps.base.outputs.run != ''
        working-directory: /Users/Shared
        run: |
          set -eux
          t=$(date +%s)
          gsha256sum -c tree.tar.zst.sha256
          zstd -dc tree.tar.zst | tar -xf -
          rm tree.tar.zst tree.tar.zst.sha256
          echo "unpack_seconds_phase${{ inputs.phase }}=$(( $(date +%s) - t ))" >> hb/stats.txt
          df -h /
          # Siso rebuilds every output whose mtime is older than its depslog entry,
          # so whole-second mtimes (a non-pax tar) silently restart the build.
          out=hb/helium-macos/build/src/out/Default
          [ -f "$out/.siso_fs_state" ] || { echo "::error::tree has no .siso_fs_state; the build would start over"; exit 1; }
          case $(stat -f %Fm "$out/.siso_deps") in
            *.000000000) echo "::error::mtimes lost their sub-second part; siso would rebuild everything"; exit 1 ;;
          esac

      - name: Prepare Helium sources (phase 1)
        if: inputs.phase == 1
        env:
          BASE: ${{ steps.base.outputs.run }}
        run: |
          set -eux
          # On a base tree, prepare beside it: Helium's steps rewrite files in place
          # and cannot be undone, so a fresh tree is the only correct source.
          PREP=$ROOT; [ -z "$BASE" ] || PREP=/Users/Shared/hb-new
          mkdir -p "$PREP"
          cp -R "$GITHUB_WORKSPACE/baa/chromium/helium" "$GITHUB_WORKSPACE/baa/chromium/helium-macos" "$GITHUB_WORKSPACE/baa/chromium/patches" "$GITHUB_WORKSPACE/baa/chromium/baa" "$PREP/"
          cd "$PREP/helium-macos"
          t=$(date +%s)
          source devutils/shared.sh
          prepare_sources true
          rm -rf "$_download_cache"
          if [ -n "$BASE" ]; then
            # No -t: a file whose content is unchanged keeps the base tree's mtime, so
            # siso skips it; a changed one is rewritten with a new mtime and rebuilt.
            "$(brew --prefix)/bin/rsync" -rlpc --delete --stats --exclude=/helium-macos/build/src/out "$PREP/" "$ROOT/"
            cd "$ROOT/helium-macos" && rm -rf "$PREP"
            # shared.sh keeps an already-set _root_dir, which still names $PREP.
            unset _root_dir
            source devutils/shared.sh
            rm -f "$ROOT/remaining.txt"
          fi
          echo "prepare_seconds=$(( $(date +%s) - t ))" > "$ROOT/stats.txt"
          [ -z "$BASE" ] || echo "base_run=$BASE" >> "$ROOT/stats.txt"
          write_gn_args arm64 "$BAA_MODE"
          cat "$_out_dir/args.gn"
          gn_gen
          du -sh "$_src_dir"
          df -h /

      - name: Build
        id: build
        working-directory: /Users/Shared/hb
        run: |
          set -ux
          source helium-macos/devutils/shared.sh
          # Leave 75 min of the 6 h limit to pack and upload ~tens of GB.
          left=$(( 360*60 - 75*60 - $(date +%s) + JOB_START ))
          B=$BAA_BUDGET; [ -z "$B" ] || left=$(( B * 60 ))
          if [ $left -lt 60 ]; then echo "status=running" >> "$GITHUB_OUTPUT"; exit 0; fi
          t=$(date +%s)
          # Release also builds the packaging dir (dmg_tool, hfs_tool) the engine artifact carries.
          targets=chrome; [ "$BAA_MODE" = dev ] || targets="chrome chrome/installer/mac"
          # The step shell runs with -e -o pipefail: capture the timeout's 124 instead of dying on it.
          set +e
          (cd "$_src_dir" && SISO_PATH="$_siso_path" gtimeout -k 7m -s SIGTERM "${left}s" python3 "$_depot_tools_dir/autoninja.py" -C "$_out_dir" $targets) 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          set -e
          echo "build_seconds_phase${{ inputs.phase }}=$(( $(date +%s) - t ))" >> stats.txt
          # Why siso ran steps: a resumed phase should not be all "doesn't exist"/"changed".
          E="$_out_dir/siso_explain"
          # Diagnostics only: head closes the pipe early, and under pipefail that SIGPIPE must not end the step before the 124 check.
          [ ! -f "$E" ] || { head -15 "$E" | cut -c1-240; sed -E 's/^(output|deps for) [^ ]+/\1 _/; s/ for [^ ]+$//; s/input .*/input/' "$E" | sort | uniq -c | sort -rn | head; } || true
          if [ $code -eq 124 ]; then
            [ "${{ inputs.last }}" = false ] || { echo "::error::gave up after phase ${{ inputs.phase }}"; echo "status=failed" >> "$GITHUB_OUTPUT"; exit 0; }
            # A phase that kept the last one's work ends with far fewer steps left.
            # Without this, a lost hand-off only shows as a chain that never ends.
            read -r done remaining < <(grep -oE '[0-9]+ done, [0-9]+ failed, [0-9]+ remaining' build.log | tail -1 | awk '{print $1, $5}')
            [ -n "${remaining:-}" ] || { echo "::error::no siso step summary in build.log"; exit 1; }
            echo "remaining_phase${{ inputs.phase }}=$remaining" >> stats.txt
            if [ -f remaining.txt ] && [ "$remaining" -gt $(( $(cat remaining.txt) - done / 2 )) ]; then
              echo "::error::no progress kept: $remaining steps left after $done done; the last phase left $(cat remaining.txt)"; exit 1
            fi
            echo "$remaining" > remaining.txt
            echo "status=running" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ $code -ne 0 ]; then
            # Keep the hours compiled so far: Pack tree uploads it and a rerun with
            # base_run=<this run> resumes there. "Fail the build" ends the job red.
            grep -A12 '^FAILED:' build.log | sed 's/^/::error::/' | head -40 || true
            echo "status=failed" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "status=finished" >> "$GITHUB_OUTPUT"

      - name: Report
        if: steps.build.outputs.status == 'finished'
        working-directory: /Users/Shared/hb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          source helium-macos/devutils/shared.sh
          du -sh "$_out_dir/baa.app"
          STARTED=$(date -j -u -f %Y-%m-%dT%H:%M:%SZ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .run_started_at)" +%s)
          {
            echo "## baa Chromium $(cat helium/chromium_version.txt) $BAA_MODE build on $BAA_RUNNER, $(xcodebuild -version | tr '\n' ' ')"
            echo "- phases: ${{ inputs.phase }}"
            echo "- commit: $GITHUB_SHA"
            echo "- wall clock incl. queueing: $(( ($(date +%s) - STARTED) / 3600 )) h $(( ($(date +%s) - STARTED) % 3600 / 60 )) m"
            echo '```'; cat stats.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack engine
        if: steps.build.outputs.status == 'finished' && inputs.mode == 'release'
        working-directory: /Users/Shared/hb/helium-macos/build/src/out/Default
        run: |
          set -eux
          T=$(git -C "$GITHUB_WORKSPACE/baa" rev-parse HEAD:chromium)
          echo "ENGINE=baa-engine-$T" >> "$GITHUB_ENV"
          jq -n --arg t "$T" --arg sha "$GITHUB_SHA" \
            --arg chromium "$(cat /Users/Shared/hb/helium/chromium_version.txt)" \
            --arg helium "$(cat "$GITHUB_WORKSPACE/baa/chromium/HELIUM_RELEASE")" \
            --arg abi "$(sed -n 's/^#define BAA_ABI_VERSION //p' /Users/Shared/hb/baa/baa.h)" \
            '{tree:$t, commit:$sha, chromium:$chromium, helium:$helium, abi:$abi}' > engine.json
          cat engine.json
          # tar keeps the framework's Versions/Current symlinks; upload-artifact on a directory would not.
          tar -cf - baa.app "baa Packaging" engine.json | zstd -T0 -10 -o /Users/Shared/engine.tar.zst
          ls -lh /Users/Shared/engine.tar.zst
          # Consumers check the tarball against this, taken from the same run.
          (cd /Users/Shared && shasum -a 256 engine.tar.zst | tee engine.tar.zst.sha256)
          echo "- baa-engine-$T sha256: \`$(cut -d' ' -f1 /Users/Shared/engine.tar.zst.sha256)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload engine
        if: steps.build.outputs.status == 'finished' && inputs.mode == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ENGINE }}
          path: /Users/Shared/engine.tar.zst
          retention-days: 90
          compression-level: 0

      - name: Upload engine checksum
        if: steps.build.outputs.status == 'finished' && inputs.mode == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ENGINE }}.sha256
          path: /Users/Shared/engine.tar.zst.sha256
          retention-days: 90

      # A finished release keeps its tree too: an engine fix then rebuilds with base_run=<this run>
      # instead of from scratch.
      - name: Pack tree
        if: steps.build.outputs.status == 'running' || steps.build.outputs.status == 'finished' || (steps.build.outputs.status == 'failed' && inputs.mode == 'release')
        working-directory: /Users/Shared
        run: |
          set -eux
          # --remove-files: the archive never sits beside the whole tree on disk.
          # posix (pax) keeps sub-second mtimes, which siso compares; the default format drops them.
          gtar --format=posix --remove-files --exclude='.git' -cf - hb | zstd -3 -T0 -o tree.tar.zst
          ls -lh tree.tar.zst
          gsha256sum tree.tar.zst | tee tree.tar.zst.sha256
          df -h /

      - name: Upload tree
        if: steps.build.outputs.status == 'running' || steps.build.outputs.status == 'finished' || (steps.build.outputs.status == 'failed' && inputs.mode == 'release')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.TREE }}
          path: /Users/Shared/tree.tar.zst
          overwrite: true
          retention-days: ${{ steps.build.outputs.status == 'finished' && 7 || 2 }}
          compression-level: 0

      - name: Upload tree checksum
        if: steps.build.outputs.status == 'running' || steps.build.outputs.status == 'finished' || (steps.build.outputs.status == 'failed' && inputs.mode == 'release')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.TREE }}.sha256
          path: /Users/Shared/tree.tar.zst.sha256
          overwrite: true
          retention-days: ${{ steps.build.outputs.status == 'finished' && 7 || 2 }}

      - name: Fail the build
        if: steps.build.outputs.status == 'failed'
        run: |
          echo "::error::build failed; its tree is uploaded (release): rerun chromium.yml with base_run=$GITHUB_RUN_ID to resume"
          exit 1
