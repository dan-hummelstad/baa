# The //baa harness tests (crates/baa-chromium/tests) on the release engine of this commit's
# chromium/ tree: real windows, so macOS. Nothing waits for this workflow (user, 2026-11-21):
# the tests depend on timing and have failed without a fault, so a red run here stops neither
# a landing nor a release. chromium.yml starts it when an engine is finished; a push to main
# runs it only when it changed something the tests can see.
name: harness

on:
  push:
    branches: [main]
    paths:
      - "chromium/**"
      - "crates/baa-chromium/**"
      - "vendor/gpui_apple/**"
      - "Cargo.lock"
      - ".github/workflows/harness.yml"
      - ".github/actions/harness/**"
      - ".github/actions/engine/**"
  workflow_dispatch:

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  harness:
    runs-on: macos-15
    timeout-minutes: 60
    # actions: read for the engine action and the engine download.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: engine
        uses: ./.github/actions/engine
      - if: steps.engine.outputs.run == ''
        run: echo "::notice::no release engine for engine key ${{ steps.engine.outputs.tree }} yet; chromium.yml starts this workflow when it has built one"
      - if: steps.engine.outputs.run != ''
        uses: ./.github/actions/setup
      - if: steps.engine.outputs.run != ''
        uses: ./.github/actions/harness
        with:
          run-id: ${{ steps.engine.outputs.run }}
          artifact: ${{ steps.engine.outputs.name }}
