# PLAN.md §13, "always current Chromium". Daily: if every target platform shares
# a newer stable CEF than Cargo.lock pins, and the `cef` crate for it is out,
# open a PR and auto-merge it once ci.yml (incl. the privacy proxy test) is green.
# The merge to main then triggers release.yml.
#
# A crate that lags the CEF release fails this run (red scheduled run = the
# notification); it retries daily. Per-platform skew is not supported: one `cef`
# crate version fixes the CEF build for every platform.
#
# Secrets:
#   BOT_TOKEN  fine-grained PAT (or GitHub App token) on this repo with
#              contents + pull-requests read/write. GITHUB_TOKEN cannot be used:
#              PRs and merges it makes do not trigger ci.yml / release.yml.
# Repo settings: "Allow auto-merge" on; main protected with ci.yml's jobs required.
name: cef-bump

on:
  schedule: [{cron: "17 6 * * *"}]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ver
        name: Find newest stable CEF common to all targets
        run: |
          curl -sSf https://cef-builds.spotifycdn.com/index.json -o "$RUNNER_TEMP/cef.json"
          NEW=$(python3 xtask/cef_latest.py "$RUNNER_TEMP/cef.json" macosarm64 macosx64 windows64 windowsarm64)
          CUR=$(python3 xtask/cef_current.py < Cargo.lock)
          # Only move forward: a platform still on an older stable must not downgrade us.
          NEWEST=$(printf '%s\n' "$CUR" "$NEW" | sort -V | tail -n1)
          echo "new=$NEW cur=$CUR"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "bump=$([ "$NEWEST" != "$CUR" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: crate
        name: Resolve matching `cef` crate version   # crate is versioned MAJOR.x.y+CEF (e.g. 154.5.0+154.0.34)
        if: steps.ver.outputs.bump == 'true'
        run: |
          CRATE=$(python3 xtask/cef_crate_for.py "${{ steps.ver.outputs.new }}")
          echo "crate=$CRATE" >> "$GITHUB_OUTPUT"
      - name: Update pins   # Cargo.toml major + Cargo.lock; Info.plist version follows at bundle time
        if: steps.ver.outputs.bump == 'true'
        run: |
          rustup toolchain install
          python3 xtask/cef_bump.py "${{ steps.crate.outputs.crate }}"
      - id: pr
        if: steps.ver.outputs.bump == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BOT_TOKEN }}
          branch: bot/cef-${{ steps.ver.outputs.new }}
          title: "cef: bump to ${{ steps.ver.outputs.new }}"
          commit-message: "cef: bump to ${{ steps.ver.outputs.new }} (crate ${{ steps.crate.outputs.crate }})"
          body: |
            CEF ${{ steps.ver.outputs.new }} is the newest stable build on macosarm64, macosx64, windows64 and windowsarm64.
            `cef` crate ${{ steps.crate.outputs.crate }}. Auto-merges when ci.yml (build, test, clippy, privacy proxy test) passes.
          labels: cef-bump
      - if: steps.pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
